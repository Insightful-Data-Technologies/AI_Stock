<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock - Insightful Data Technologies</title>
    <meta name="description" content="AI Stock Prediction and Risk Management solutions designed to optimize investments. Led by Chanan Zevin.">
    
    <!-- DevOps Configuration: Redirect to Canva site -->
    <meta http-equiv="refresh" content="0; url=https://aizevinstocks.my.canva.site/stocks">
    
    <!-- Canonical URL for SEO -->
    <link rel="canonical" href="https://aizevinstocks.com">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            font-size: 18px;
            color: #FFD700;
        }
        
        .subtitle {
            font-size: 14px;
            color: #ccc;
            margin-top: 10px;
        }
    </style>
    
    <script>
        // DevOps redirect configuration
        function redirectToCanva() {
            const targetURL = 'https://aizevinstocks.my.canva.site/stocks';
            
            // Check if we're on the correct domain
            if (window.location.hostname === 'aizevinstocks.com' || 
                window.location.hostname === 'www.aizevinstocks.com' ||
                window.location.hostname === 'localhost') {
                
                // Use replace to avoid back button issues
                window.location.replace(targetURL);
            }
        }
        
        // Immediate redirect
        redirectToCanva();
        
        // Backup redirect after 100ms
        setTimeout(redirectToCanva, 100);
        
        // Final backup after 2 seconds
        setTimeout(redirectToCanva, 2000);
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <div class="message">Loading AI Stock Platform...</div>
        <div class="subtitle">Redirecting to your Canva site...</div>
    </div>
    
    <!-- Fallback for users with JavaScript disabled -->
    <noscript>
        <div style="text-align: center; padding: 50px; color: #FFD700;">
            <h1>AI Stock - Insightful Data Technologies</h1>
            <p>If you are not automatically redirected, <a href="https://aizevinstocks.my.canva.site/stocks" style="color: #FFD700; text-decoration: none;">click here to continue</a></p>
        </div>
    </noscript>
</body>
</html>
