<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Capital — App Launch Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121820;
      --panel-2: #18212b;
      --ink: #e7eef5;
      --muted: #8fa3b5;
      --line: rgba(231, 238, 245, 0.1);
      --cyan: #2fd3d8;
      --on: #5fbf7a;
      --off: #d45a5a;
      --yellow: #e8c44a;
      --font-display: "Syne", "Avenir Next", sans-serif;
      --font-body: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(900px 500px at 10% -20%, rgba(47, 211, 216, 0.12), transparent 55%),
        radial-gradient(700px 420px at 90% 0%, rgba(95, 191, 122, 0.08), transparent 50%),
        linear-gradient(180deg, #0b0f14, #10161d 40%, #0b0f14);
    }
    .wrap {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.25rem 0 2.5rem;
    }
    .brand {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 1rem;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.65rem;
    }
    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
    }
    .tab[aria-selected="true"] {
      color: var(--ink);
      background: rgba(47, 211, 216, 0.12);
      box-shadow: inset 0 -2px 0 var(--cyan);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }
    .card {
      background: linear-gradient(165deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.1rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 210px;
    }
    .card.yellow {
      border-color: rgba(232, 196, 74, 0.85);
      background:
        linear-gradient(135deg, rgba(232, 196, 74, 0.22), rgba(196, 163, 90, 0.08)),
        linear-gradient(165deg, #2a2414, #1a1710);
      box-shadow: 0 0 0 1px rgba(232, 196, 74, 0.25) inset;
    }
    .card.yellow h2 { color: #fff6d4; }
    .card.yellow .sub, .card.yellow p { color: #e8d9a8; }
    .card h2 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin: 0;
    }
    .sub { color: var(--muted); font-size: 0.88rem; }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
      flex: 1;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.88rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--off);
      box-shadow: 0 0 0 3px rgba(212, 90, 90, 0.2);
    }
    .dot.on {
      background: var(--on);
      box-shadow: 0 0 0 3px rgba(95, 191, 122, 0.22);
    }
    .working {
      font-size: 0.78rem;
      color: var(--on);
      font-weight: 600;
    }
    .working.bad { color: var(--off); }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), #5fbf7a);
      color: #042226;
    }
    .card.yellow .btn-primary {
      background: linear-gradient(135deg, #f0d56a, #c4a35a);
      color: #1a1408;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .card.yellow .btn-ghost {
      border-color: rgba(232, 196, 74, 0.45);
      color: #fff6d4;
    }
    .footer {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      background: #132029;
      border: 1px solid var(--line);
      padding: 0.7rem 0.9rem;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: 220ms ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">AI Capital — App Launch Center</h1>
    <nav class="tabs" role="tablist" aria-label="Launch categories">
      <button class="tab" type="button" data-tab="all">All</button>
      <button class="tab" type="button" data-tab="create-content">Create Content</button>
      <button class="tab" type="button" data-tab="command">Command</button>
      <button class="tab" type="button" data-tab="pipelines">Pipelines</button>
      <button class="tab" type="button" data-tab="sites">Sites</button>
      <button class="tab" type="button" data-tab="meetings" aria-selected="true">Meetings</button>
      <button class="tab" type="button" data-tab="builders">Builders</button>
      <button class="tab" type="button" data-tab="agents">Agents</button>
      <button class="tab" type="button" data-tab="analytics">Analytics</button>
      <button class="tab" type="button" data-tab="mail">Mail</button>
    </nav>

    <section class="grid" id="cards" aria-label="Apps"></section>

    <footer class="footer">
      <span>Hub port: <strong id="hubPort">4720</strong></span>
      <span>All meeting buttons → this port (not 3000)</span>
      <span>Does not store passwords</span>
    </footer>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const APPS = [
      {
        id: "general-dashboard",
        tab: "all",
        title: "General dashboard",
        subtitle: "Yellow · Launch / Open Link",
        description: "General dashboard — Launch / Open Link",
        path: "/dashboard",
        launchKey: "general_dashboard",
        yellow: true,
      },
      {
        id: "meeting-room",
        tab: "meetings",
        title: "Meeting Room",
        subtitle: "חדר ישיבות · AI cinema",
        description: "Cabinet meeting room + YouTube + live agents",
        path: "/meeting-room",
        launchKey: "meeting_room",
        yellow: true,
      },
      {
        id: "one-on-one",
        tab: "meetings",
        title: "One on One Meeting",
        subtitle: "One on One Meeting",
        description: "One-on-one meeting room with Ultra Agent",
        path: "/meeting-room",
        launchKey: "one_on_one",
        yellow: false,
      },
      {
        id: "war-room",
        tab: "meetings",
        title: "Multi-Agent War Room",
        subtitle: "Enterprise org meeting",
        description: "Full AI Capital enterprise team room",
        path: "/meeting-room",
        launchKey: "war_room",
        yellow: false,
      },
      {
        id: "create-content",
        tab: "create-content",
        title: "Create Content",
        subtitle: "Articles · Text · MD · Image · Canva · Keyboard",
        description: "Open Create Content tools on this port (4720)",
        path: "/site-editor#create-content",
        launchKey: "create_content",
        yellow: true,
      },
      {
        id: "content-studio",
        tab: "create-content",
        title: "Content Studio",
        subtitle: "Writing · Translate · Rewrite",
        description: "AI writing and translation — Rewrite works without DeploymentNotFound",
        path: "/content-studio",
        launchKey: "content_studio",
        yellow: true,
      },
      {
        id: "site-editor",
        tab: "create-content",
        title: "Site Editor CMS",
        subtitle: "Operations · tickets · MD docs",
        description: "Manager CMS — Operations/Company Core without SQL sa2 crash",
        path: "/site-editor",
        launchKey: "site_editor",
        yellow: true,
      },
    ];

    let activeTab = "meetings";
    const cardsEl = document.getElementById("cards");
    const toastEl = document.getElementById("toast");
    const statusCache = {};

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2400);
    }

    function portNow() {
      return location.port || "4720";
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function render() {
      const apps = APPS.filter(
        (a) =>
          a.id === "general-dashboard" ||
          a.id === "meeting-room" ||
          a.id === "create-content" ||
          activeTab === "all" ||
          a.tab === activeTab
      );
      const port = portNow();
      cardsEl.innerHTML = apps
        .map((app) => {
          const st = statusCache[app.id] || { on: true, port };
          const on = st.on !== false;
          const p = st.port || port;
          return `<article class="card ${app.yellow ? "yellow" : ""}" data-id="${app.id}">
            <h2>${app.title}</h2>
            <div class="sub">${app.subtitle}</div>
            <p>${app.description}</p>
            <div class="status-row">
              <div class="status">
                <span class="dot ${on ? "on" : ""}"></span>
                <span>${on ? "On" : "Off"} · ${p}</span>
              </div>
              <span class="working ${on ? "" : "bad"}">${on ? "Ready" : "Broken"}</span>
            </div>
            <div class="actions">
              <button class="btn btn-primary" type="button" data-launch="${app.id}">Launch</button>
              <button class="btn btn-ghost" type="button" data-open="${app.id}">Open Link</button>
            </div>
          </article>`;
        })
        .join("");
    }

    async function refreshStatus() {
      try {
        const data = await api("/api/apps/status");
        for (const app of APPS) {
          const row = (data.apps || []).find((a) => a.id === app.id);
          statusCache[app.id] = row || { on: true, port: portNow() };
        }
        if (data.active_port) document.getElementById("hubPort").textContent = data.active_port;
      } catch (_) {
        for (const app of APPS) statusCache[app.id] = { on: true, port: portNow() };
      }
      render();
    }

    async function go(appId) {
      const app = APPS.find((a) => a.id === appId);
      if (!app) return;
      try {
        const data = await api("/api/apps/launch", {
          method: "POST",
          body: JSON.stringify({ id: app.launchKey }),
        });
        location.href = data.path || app.path;
      } catch (err) {
        toast(String(err.message || err));
        location.href = app.path;
      }
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        activeTab = tab.dataset.tab;
        document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t === tab)));
        render();
      });
    });

    cardsEl.addEventListener("click", (e) => {
      const launch = e.target.closest("[data-launch]");
      const open = e.target.closest("[data-open]");
      if (launch) go(launch.dataset.launch);
      if (open) go(open.dataset.open);
    });

    document.getElementById("hubPort").textContent = portNow();
    refreshStatus();
    setInterval(refreshStatus, 4000);
  </script>
</body>
</html>
