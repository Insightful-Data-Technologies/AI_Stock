<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Capital — Buttons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121820;
      --ink: #e7eef5;
      --muted: #8fa3b5;
      --line: rgba(231, 238, 245, 0.12);
      --cyan: #2fd3d8;
      --on: #5fbf7a;
      --font-display: "Syne", sans-serif;
      --font-body: "IBM Plex Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(900px 500px at 10% -20%, rgba(47, 211, 216, 0.12), transparent 55%),
        linear-gradient(180deg, #0b0f14, #10161d 40%, #0b0f14);
    }
    .wrap {
      width: min(720px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }
    .brand {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      margin: 0 0 0.35rem;
    }
    .tag {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }
    .port-pill {
      display: inline-flex;
      gap: 0.4rem;
      align-items: center;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .port-pill strong { color: var(--cyan); }
    .stack { display: grid; gap: 0.9rem; }
    .card {
      background: linear-gradient(165deg, #18212b, var(--panel));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.15rem 1.1rem;
    }
    .card h2 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      margin: 0 0 0.35rem;
    }
    .card p {
      margin: 0 0 1rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.55rem; }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 0.85rem 1.2rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 8.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), #5fbf7a);
      color: #042226;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      background: #132029;
      border: 1px solid var(--line);
      padding: 0.7rem 0.9rem;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: 220ms ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="brand">AI Capital — Launch Center</h1>
    <p class="tag">Only buttons. Works on port <strong>4720</strong> or <strong>4600</strong>.</p>
    <div class="port-pill">This page · port <strong id="hubPort">—</strong></div>

    <section class="stack" aria-label="Launch buttons">
      <article class="card">
        <h2>Meeting Room</h2>
        <p>AI cabinet chamber + YouTube film. Click to open.</p>
        <div class="actions">
          <button class="btn btn-primary" type="button" id="btnMeeting">Open Meeting Room</button>
        </div>
      </article>

      <article class="card">
        <h2>Dashboard</h2>
        <p>General dashboard on this same port.</p>
        <div class="actions">
          <button class="btn btn-ghost" type="button" id="btnDash">Open Dashboard</button>
        </div>
      </article>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const toastEl = document.getElementById("toast");
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function currentPort() {
      return location.port || "4720";
    }

    document.getElementById("hubPort").textContent = currentPort();

    async function launch(id, fallbackPath) {
      try {
        const res = await fetch("/api/apps/launch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        location.href = data.path || data.url || fallbackPath;
      } catch (err) {
        toast(String(err.message || err));
        location.href = fallbackPath;
      }
    }

    document.getElementById("btnMeeting").addEventListener("click", () => {
      launch("meeting_room", "/meeting-room");
    });
    document.getElementById("btnDash").addEventListener("click", () => {
      launch("general_dashboard", "/dashboard");
    });
  </script>
</body>
</html>
