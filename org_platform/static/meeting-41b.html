<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meeting 41 B · Visuals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/room.css" />
  <style>
    .sim-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      position: relative;
      z-index: 1;
    }
    .sim-card {
      width: min(560px, 100%);
      padding: 1.75rem 1.5rem;
      border-radius: 18px;
      border: 1px solid rgba(176, 141, 87, 0.55);
      background:
        linear-gradient(165deg, rgba(48, 38, 28, 0.96), rgba(15, 20, 25, 0.98));
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      animation: rise 700ms ease both;
    }
    .sim-card h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin: 0 0 0.45rem;
      letter-spacing: -0.02em;
    }
    .sim-card p {
      color: var(--muted);
      margin: 0 0 1.1rem;
      line-height: 1.45;
    }
    .sim-status {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 1.15rem;
      font-size: 0.92rem;
    }
    .sim-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 0 4px rgba(166, 124, 82, 0.2);
      animation: pulse 1.4s ease infinite;
    }
    .sim-dot.ok {
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(107, 143, 113, 0.22);
    }
    .sim-dot.err {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(180, 85, 85, 0.22);
      animation: none;
    }
    .preview {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 0.75rem;
      margin: 0 0 1.1rem;
    }
    .preview figure {
      margin: 0;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #0b1014;
    }
    .preview img, .preview video {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
    .preview figcaption {
      padding: 0.4rem 0.55rem;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .sim-error {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem 0.85rem;
      border-radius: 12px;
      border: 1px solid rgba(180, 85, 85, 0.45);
      background: rgba(180, 85, 85, 0.12);
      color: #f0cfcf;
      font-size: 0.88rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="sim-shell">
    <div class="sim-card">
      <h1>Meeting 41 B</h1>
      <p>מחר · מצלמה שלך עליך · שיתוף מסך · אווטאר אנושי שלי (מראה בחורה) עם קול אנושי.</p>
      <div class="preview">
        <figure>
          <img id="poster" src="/static/assets/avatar/agent-girl.png" alt="AI human avatar" />
          <figcaption>אווטאר שלי · מראה אנושי</figcaption>
        </figure>
        <figure>
          <video id="previewVid" src="/static/assets/avatar/agent-girl.mp4" muted loop playsinline autoplay></video>
          <figcaption>וידאו אווטאר · ניתן להחליף בקובץ מהדסקטופ</figcaption>
        </figure>
      </div>
      <div class="sim-status">
        <span class="sim-dot" id="dot"></span>
        <span id="status">בודק שירות ויוצר חדר 41 B…</span>
      </div>
      <div class="actions">
        <a class="btn btn-ghost" href="/dashboard">Dashboard</a>
        <a class="btn btn-steel" href="/">Org home</a>
      </div>
      <div class="sim-error" id="err"></div>
    </div>
  </div>
  <script>
    const statusEl = document.getElementById("status");
    const dot = document.getElementById("dot");
    const err = document.getElementById("err");

    async function boot() {
      try {
        const health = await fetch("/api/health");
        if (!health.ok) throw new Error("Health check failed");
        const ensure = await fetch("/api/meetings/41b/ensure", { method: "POST" });
        if (!ensure.ok) throw new Error(await ensure.text());
        const data = await ensure.json();
        const mid = data.meeting?.id;
        if (!mid) throw new Error("No meeting id returned");
        localStorage.setItem("meeting_41b_id", mid);
        dot.classList.add("ok");
        statusEl.textContent = "חדר מוכן — נכנסים…";
        location.replace(`/meeting/${mid}`);
      } catch (e) {
        dot.classList.add("err");
        statusEl.textContent = "לא הצלחתי לפתוח את Meeting 41 B";
        err.style.display = "block";
        err.textContent = String(e.message || e);
      }
    }
    boot();
  </script>
</body>
</html>
