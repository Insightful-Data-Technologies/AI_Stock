<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meeting Room — Insightful Data Technologies – 2.o AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/room.css" />
</head>
<body>
  <div class="room-shell">
    <header class="room-top">
      <div>
        <div style="color:var(--muted);font-size:0.82rem;margin-bottom:0.2rem;">Insightful Data Technologies – 2.o AI · Chanan Zevin – CEO · Live meeting room</div>
        <h1 id="meetingTitle">Connecting…</h1>
      </div>
      <div class="actions">
        <a class="btn btn-ghost" href="/">Org home</a>
        <button class="btn btn-steel" id="escalateBtn" type="button">Escalate to CEO</button>
        <button class="btn btn-ghost" id="endBtn" type="button">End meeting</button>
      </div>
    </header>

    <section class="room-layout">
      <aside class="side">
        <div class="side-head">Visible participants</div>
        <div id="participants" class="participants"></div>
      </aside>

      <section class="stage chat">
        <div class="voice-bar">
          <button class="btn btn-steel" id="voiceToggle" type="button">Voice on</button>
          <button class="btn btn-ghost" id="micBtn" type="button">Hold to talk</button>
          <span id="voiceStatus" style="color:var(--muted);font-size:0.82rem;">Neural browser voices · live replies spoken</span>
        </div>
        <div class="stage-head">Messages · live responses · history</div>
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <input id="chatInput" placeholder="Speak to the room — approvals auto-cleared by VP Super Admin" autocomplete="off" />
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
      </section>

      <aside class="rail">
        <div class="rail-head">Approvals &amp; escalations</div>
        <div id="events" class="events"></div>
        <div class="rail-head">Meeting meta</div>
        <div id="meta" class="events"></div>
      </aside>
    </section>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/static/js/meeting.js"></script>
</body>
</html>
