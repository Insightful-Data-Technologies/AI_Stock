<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CEO → Cursor · פגישה חיה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f3e6d0;
      --muted: #c4b49a;
      --deep: #080604;
      --panel: #120e0a;
      --line: rgba(214, 179, 106, 0.22);
      --brass: #d6b36a;
      --green: #3dcf7a;
      --font-display: "Cormorant Garamond", serif;
      --font-body: "Manrope", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: var(--font-body);
      background: var(--deep);
    }
    .room {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 0.75rem;
      gap: 0.65rem;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(201, 162, 74, 0.12), transparent 55%),
        var(--deep);
    }
    .faces {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      min-height: 0;
    }
    @media (max-width: 820px) {
      .faces { grid-template-columns: 1fr; }
    }
    .tile {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel);
      min-height: min(62vh, 560px);
      isolation: isolate;
    }
    .tile video,
    .tile img,
    .tile iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
      display: block;
    }
    /* Cinema motion — same energy as the reference reel */
    .tile .cinema {
      transform: scale(1.08);
      animation: drift 22s ease-in-out infinite alternate, lamp 5.5s ease-in-out infinite;
      filter: saturate(1.06) contrast(1.04);
    }
    .tile.speaking .cinema {
      animation: drift 10s ease-in-out infinite alternate, talkPulse 1.1s ease-in-out infinite;
    }
    @keyframes drift {
      from { transform: scale(1.06) translate3d(-1.2%, 0.4%, 0); }
      to { transform: scale(1.12) translate3d(1.4%, -0.8%, 0); }
    }
    @keyframes lamp {
      0%, 100% { filter: saturate(1.05) contrast(1.04) brightness(1); }
      50% { filter: saturate(1.12) contrast(1.06) brightness(1.06); }
    }
    @keyframes talkPulse {
      0%, 100% { filter: saturate(1.08) brightness(1.02); }
      50% { filter: saturate(1.18) brightness(1.1); }
    }
    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(8,5,3,0.15) 0%, transparent 35%, rgba(8,5,3,0.55) 100%);
    }
    .label {
      position: absolute;
      left: 0.7rem;
      bottom: 0.7rem;
      z-index: 3;
      font-family: var(--font-display);
      font-size: 1.15rem;
      text-shadow: 0 8px 24px rgba(0,0,0,0.65);
    }
    .label small {
      display: block;
      font-family: var(--font-body);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .live {
      position: absolute;
      right: 0.7rem;
      top: 0.7rem;
      z-index: 3;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      border: 1px solid rgba(61, 207, 122, 0.55);
      background: rgba(12, 28, 18, 0.7);
      color: #d8ffe8;
    }
    .me-photo { z-index: 1; }
    .me-cam {
      z-index: 2;
      opacity: 0;
      transition: opacity 280ms ease;
    }
    .tile.has-cam .me-cam { opacity: 1; }
    .tile.has-cam .me-photo { opacity: 0.12; }
    .agent-film { z-index: 1; }
    .agent-loop {
      z-index: 1;
      opacity: 0;
    }
    .tile.use-loop .agent-film { opacity: 0; pointer-events: none; }
    .tile.use-loop .agent-loop { opacity: 1; }
    .dock {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 0.2rem 0.55rem;
    }
    .dock button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(18, 14, 10, 0.85);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.55rem 0.95rem;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .dock button.on {
      border-color: rgba(61, 207, 122, 0.65);
      color: #d8ffe8;
    }
    .hearing {
      width: 100%;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      min-height: 1.2em;
    }
    .hearing em { color: var(--ink); font-style: italic; }
    /* Writing stays closed until needed */
    .write {
      display: none;
      width: min(720px, 100%);
      margin: 0 auto;
      grid-template-columns: 1fr auto;
      gap: 0.4rem;
    }
    .write.open { display: grid; }
    .write input {
      border: 1px solid var(--line);
      background: #100c08;
      color: var(--ink);
      border-radius: 12px;
      padding: 0.7rem 0.85rem;
      font: inherit;
    }
    .write button {
      border: 0;
      border-radius: 12px;
      padding: 0 1rem;
      background: linear-gradient(135deg, #d6b36a, #a8843a);
      color: #1a120c;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="room">
    <section class="faces">
      <article class="tile" id="meTile">
        <img class="me-photo cinema" id="mePhoto" src="/static/assets/portraits/ceo-chanan.png" alt="Chanan Zevin" />
        <video class="me-cam" id="meCam" playsinline autoplay muted></video>
        <div class="live" id="micLive">מקשיב</div>
        <div class="label">Chanan Zevin<small>CEO · אני</small></div>
      </article>

      <article class="tile" id="agentTile">
        <!-- Reference cinema motion from the reel (first ~30–60s energy) -->
        <iframe
          class="agent-film cinema"
          id="agentFilm"
          title="AI meeting cinema"
          allow="autoplay; encrypted-media"
          referrerpolicy="strict-origin-when-cross-origin"
          src="https://www.youtube.com/embed/_XwN09djHuM?start=1&autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&loop=1&playlist=_XwN09djHuM&playsinline=1"
        ></iframe>
        <video class="agent-loop cinema" id="agentLoop" playsinline muted loop poster="/static/assets/avatar/agent-girl.png"></video>
        <div class="live" id="youLive">איתך</div>
        <div class="label">Cursor · VP R&D<small>את · אווטאר חי</small></div>
      </article>
    </section>

    <div class="dock">
      <button type="button" id="camBtn">מצלמה</button>
      <button type="button" id="micBtn" class="on">שמיעה</button>
      <button type="button" id="writeBtn">כתיבה</button>
      <button type="button" id="endBtn">סיום</button>
      <div class="hearing" id="hearing"></div>
      <form class="write" id="writeForm">
        <input id="chatInput" placeholder="רק כשצריך…" autocomplete="off" />
        <button type="submit">שלח</button>
      </form>
    </div>
  </div>

  <script>
    const YT = "https://www.youtube.com/embed/_XwN09djHuM?start=1&autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&loop=1&playlist=_XwN09djHuM&playsinline=1";
    const state = {
      meetingId: null,
      camOn: false,
      micOn: true,
      listenOn: true,
      camStream: null,
      recognition: null,
      agentSpeaking: false,
      busy: false,
      utteranceBuf: "",
      silenceTimer: null,
      historyLocal: [],
    };

    const el = (id) => document.getElementById(id);

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function escapeHtml(s) {
      return String(s).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    async function ensureMeeting() {
      const data = await api("/api/meetings/forecast/ensure", { method: "POST" });
      state.meetingId = data.meeting.id;
      return data.meeting;
    }

    async function sendChat(text, source = "mic") {
      const cleaned = (text || "").trim();
      if (!cleaned || state.busy) return;
      state.busy = true;
      pauseListen();
      el("youLive").textContent = "…";
      try {
        if (!state.meetingId) await ensureMeeting();
        state.historyLocal.push({ role: "me", text: cleaned });
        const data = await api(`/api/meetings/${state.meetingId}/messages`, {
          method: "POST",
          body: JSON.stringify({
            text: cleaned,
            sender_id: "ceo-chanan",
            sender_name: "Me (Chanan Zevin)",
            heard: source === "mic",
            source,
            seen_frame_count: state.camOn ? 1 : 0,
          }),
        });
        const reply = (data.replies || [])[0];
        if (reply?.text) {
          state.historyLocal.push({ role: "you", text: reply.text });
          await speakAndWait(reply.text);
        }
      } catch (_) {
        /* stay in meeting; no error banners */
      } finally {
        state.busy = false;
        state.utteranceBuf = "";
        el("youLive").textContent = "איתך";
        el("hearing").innerHTML = "";
        resumeListen();
      }
    }

    function speakAndWait(text) {
      return new Promise((resolve) => {
        state.agentSpeaking = true;
        el("agentTile").classList.add("speaking");
        if (!window.speechSynthesis || !text) {
          setTimeout(() => {
            state.agentSpeaking = false;
            el("agentTile").classList.remove("speaking");
            resolve();
          }, Math.min(7000, 1400 + text.length * 35));
          return;
        }
        const u = new SpeechSynthesisUtterance(text);
        const voices = speechSynthesis.getVoices();
        const v =
          voices.find((x) => /he/i.test(x.lang)) ||
          voices.find((x) => /female|zira|aria/i.test(`${x.lang} ${x.name}`)) ||
          voices[0];
        if (v) u.voice = v;
        u.rate = 1.04;
        u.onend = u.onerror = () => {
          state.agentSpeaking = false;
          el("agentTile").classList.remove("speaking");
          resolve();
        };
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      });
    }

    async function toggleCam() {
      if (state.camOn) {
        state.camStream?.getTracks().forEach((t) => t.stop());
        state.camStream = null;
        el("meCam").srcObject = null;
        el("meTile").classList.remove("has-cam");
        state.camOn = false;
        el("camBtn").classList.remove("on");
        return;
      }
      try {
        state.camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        el("meCam").srcObject = state.camStream;
        el("meTile").classList.add("has-cam");
        state.camOn = true;
        el("camBtn").classList.add("on");
        setTimeout(pushCamFrame, 350);
      } catch (_) {
        // Portrait stays — exactly what was asked when camera fails
        el("meTile").classList.remove("has-cam");
        state.camOn = false;
        el("camBtn").classList.remove("on");
      }
    }

    async function pushCamFrame() {
      if (!state.meetingId || !state.camOn) return;
      const video = el("meCam");
      if (!video.videoWidth) return;
      const c = document.createElement("canvas");
      c.width = Math.min(640, video.videoWidth);
      c.height = Math.round((c.width / video.videoWidth) * video.videoHeight);
      c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
      try {
        await api(`/api/meetings/${state.meetingId}/frames`, {
          method: "POST",
          body: JSON.stringify({ data_url: c.toDataURL("image/jpeg", 0.7), source: "camera" }),
        });
      } catch (_) {}
    }

    function wireRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      const r = new SR();
      r.lang = "he-IL";
      r.continuous = true;
      r.interimResults = true;
      r.onresult = (ev) => {
        if (state.agentSpeaking || state.busy) return;
        let interim = "";
        let finalText = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const t = ev.results[i][0].transcript;
          if (ev.results[i].isFinal) finalText += t;
          else interim += t;
        }
        const shown = (finalText || interim || "").trim();
        if (shown) el("hearing").innerHTML = `<em>${escapeHtml(shown)}</em>`;
        if (finalText.trim()) {
          state.utteranceBuf = `${state.utteranceBuf} ${finalText}`.trim();
          clearTimeout(state.silenceTimer);
          state.silenceTimer = setTimeout(() => {
            const turn = state.utteranceBuf.trim();
            state.utteranceBuf = "";
            if (turn) sendChat(turn, "mic");
          }, 850);
        }
      };
      r.onerror = (e) => {
        if (e.error === "no-speech" || e.error === "aborted") return;
      };
      r.onend = () => {
        if (state.listenOn && !state.agentSpeaking) {
          try { r.start(); } catch (_) {}
        }
      };
      state.recognition = r;
      return r;
    }

    function resumeListen() {
      state.listenOn = true;
      state.micOn = true;
      el("micBtn").classList.add("on");
      el("micLive").textContent = "מקשיב";
      try { state.recognition?.start(); } catch (_) {}
    }

    function pauseListen() {
      state.listenOn = false;
      try { state.recognition?.stop(); } catch (_) {}
    }

    // Prefer local looping avatar clip when available (cinema motion CSS still applies).
    (function preferLoop() {
      const loop = el("agentLoop");
      loop.src = "/static/assets/avatar/agent-girl.mp4";
      loop.addEventListener("loadeddata", () => {
        el("agentTile").classList.add("use-loop");
        loop.play().catch(() => {
          el("agentTile").classList.remove("use-loop");
          el("agentFilm").src = YT;
        });
      });
      loop.addEventListener("error", () => {
        el("agentTile").classList.remove("use-loop");
        el("agentFilm").src = YT;
      });
    })();

    el("camBtn").addEventListener("click", () => toggleCam());
    el("micBtn").addEventListener("click", () => {
      if (state.micOn) {
        state.micOn = false;
        el("micBtn").classList.remove("on");
        el("micLive").textContent = "שקט";
        pauseListen();
      } else resumeListen();
    });
    el("writeBtn").addEventListener("click", () => {
      el("writeForm").classList.toggle("open");
      if (el("writeForm").classList.contains("open")) el("chatInput").focus();
    });
    el("writeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = el("chatInput");
      const text = input.value;
      input.value = "";
      await sendChat(text, "typed");
    });
    el("endBtn").addEventListener("click", async () => {
      pauseListen();
      speechSynthesis.cancel();
      if (state.meetingId) {
        try { await api(`/api/meetings/${state.meetingId}/end`, { method: "POST" }); } catch (_) {}
      }
      state.camStream?.getTracks().forEach((t) => t.stop());
      el("micLive").textContent = "סיום";
    });

    (async () => {
      wireRecognition();
      try {
        await ensureMeeting();
      } catch (_) {}
      resumeListen();
      // Camera optional — portrait already on
      toggleCam();
    })();
  </script>
</body>
</html>
