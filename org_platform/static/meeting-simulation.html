<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Agent Meeting Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/room.css" />
  <style>
    .sim-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      position: relative;
      z-index: 1;
    }
    .sim-card {
      width: min(520px, 100%);
      padding: 1.75rem 1.5rem;
      border-radius: 18px;
      border: 1px solid var(--line);
      background:
        linear-gradient(165deg, rgba(33, 48, 58, 0.95), rgba(15, 20, 25, 0.98));
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      animation: rise 700ms ease both;
    }
    .sim-card h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin: 0 0 0.45rem;
      letter-spacing: -0.02em;
    }
    .sim-card p {
      color: var(--muted);
      margin: 0 0 1.1rem;
      line-height: 1.45;
    }
    .sim-status {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 1.15rem;
      font-size: 0.92rem;
    }
    .sim-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 0 4px rgba(166, 124, 82, 0.2);
      animation: pulse 1.4s ease infinite;
    }
    .sim-dot.ok {
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(107, 143, 113, 0.22);
    }
    .sim-dot.err {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(180, 85, 85, 0.22);
      animation: none;
    }
    .sim-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }
    .sim-error {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem 0.85rem;
      border-radius: 12px;
      border: 1px solid rgba(180, 85, 85, 0.45);
      background: rgba(180, 85, 85, 0.12);
      color: #f0cfcf;
      font-size: 0.88rem;
      white-space: pre-wrap;
    }
    .sim-error.show { display: block; }
  </style>
</head>
<body>
  <main class="sim-shell">
    <section class="sim-card" aria-live="polite">
      <div class="company" style="color:var(--muted);font-size:0.85rem;margin-bottom:0.35rem;">
        AI Capital · One on One Meeting
      </div>
      <h1>AI Agent Meeting Simulation</h1>
      <p>Opening a private Ultra Agent 1:1 room with voice, barge-in, and screen share.</p>
      <div class="sim-status">
        <span class="sim-dot" id="simDot" aria-hidden="true"></span>
        <span id="simLabel">Connecting to meeting service…</span>
      </div>
      <div class="sim-actions">
        <button class="btn btn-primary" type="button" id="retryBtn">Retry</button>
        <a class="btn btn-ghost" href="/">Org home</a>
      </div>
      <div class="sim-error" id="simError"></div>
    </section>
  </main>

  <script>
    const label = document.getElementById("simLabel");
    const dot = document.getElementById("simDot");
    const err = document.getElementById("simError");
    const retryBtn = document.getElementById("retryBtn");

    function setState(kind, text, detail) {
      label.textContent = text;
      dot.classList.toggle("ok", kind === "ok");
      dot.classList.toggle("err", kind === "err");
      if (detail) {
        err.textContent = detail;
        err.classList.add("show");
      } else {
        err.textContent = "";
        err.classList.remove("show");
      }
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function openOneOnOne() {
      setState("pending", "Connecting to meeting service…");
      retryBtn.disabled = true;
      try {
        const health = await api("/api/health");
        if (!health.ok) throw new Error("Meeting service health check failed");
        setState("pending", "Starting Ultra Agent 1:1 room…");

        const ensured = await api("/api/meetings/one-on-one/ensure", { method: "POST" });
        const meeting = ensured.meeting;
        if (!meeting?.id) throw new Error("Meeting service did not return a room id");

        setState("ok", "Room ready — entering meeting…");
        try {
          localStorage.setItem("one_on_one_meeting_id", meeting.id);
        } catch (_) {
          /* ignore */
        }
        location.replace(`/meeting/${meeting.id}`);
      } catch (e) {
        setState(
          "err",
          "One-on-one meeting failed to load",
          String(e.message || e) +
            "\n\nStart the meeting service on port 3000, then retry.\n" +
            "bash org_platform/deploy/run_meeting_3000.sh"
        );
        retryBtn.disabled = false;
      }
    }

    retryBtn.addEventListener("click", openOneOnOne);
    openOneOnOne();
  </script>
</body>
</html>
